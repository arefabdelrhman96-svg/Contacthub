<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ContactHub - Smart Contact Manager</title>
  <link rel="icon" href="./image/favicon (1).png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./main.css" />
</head>
<body>

  <!-- Navbar (زجاجي شفاف + ثابت) -->
<nav class="navbar navbar-expand fixed-top nav-glass py-2">
  <div class="container-fluid px-4 px-md-5">

    <!-- اللوجو -->
    <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
      <div class="logo-box"><i class="bi bi-person-lines-fill"></i></div>
      <div class="lh-sm">
        <h1 class="brand mb-0">Contact<span>Hub</span></h1>
        <small class="text-muted fw-normal">Smart Contact Manager</small>
      </div>
    </a>

    <!-- الأزرار + الصورة -->
    <ul class="navbar-nav ms-auto flex-row align-items-center gap-2 gap-sm-3">
      <li class="nav-item">
        <button class="btn btn-primary btn-add" id="openAdd">
          <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Add Contact</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="icon-btn bell-btn" type="button" aria-label="Notifications">
          <i class="bi bi-bell-fill"></i>
        </button>
      </li>
      <li class="nav-item">
        <button class="icon-btn gear-btn" type="button" aria-label="Settings">
          <i class="bi bi-gear-fill"></i>
        </button>
      </li>
      <li class="nav-item">
        <img src="./image/avatar-4.jpg" alt="Profile" class="profile-img"
             onerror="this.src='https://ui-avatars.com/api/?name=User&background=4f46e5&color=fff'" />
      </li>
    </ul>

  </div>
</nav>
  <div class="container-fluid px-4 px-md-5">

    <!-- Stats -->
    <section class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="stat-card">
          <div class="stat-icon bg-blue"><i class="bi bi-people-fill"></i></div>
          <div><small>TOTAL</small><h3 id="totalCount">0</h3></div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="stat-card">
          <div class="stat-icon bg-orange"><i class="bi bi-star-fill"></i></div>
          <div><small>FAVORITES</small><h3 id="favCount">0</h3></div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="stat-card">
          <div class="stat-icon bg-red"><i class="bi bi-heart-pulse-fill"></i></div>
          <div><small>EMERGENCY</small><h3 id="emgCount">0</h3></div>
        </div>
      </div>
    </section>

        <!-- Contacts (بعرض الصفحة كاملة) -->
    <main class="mb-4">
      <h2 class="fw-bold mb-0">All Contacts</h2>
      <p class="text-muted mb-3" id="subtitle">Manage and organize your 0 contacts</p>

      <div class="search-box mb-3">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" class="form-control" placeholder="Search by name, phone, or email..." />
      </div>

      <div class="row g-3" id="contactsList"></div>

      <div id="emptyState" class="text-center py-5">
        <div class="empty-icon"><i class="bi bi-person-lines-fill"></i></div>
        <h6 class="mt-3 mb-1">No contacts found</h6>
        <small class="text-muted">Click "Add Contact" to get started</small>
      </div>
    </main>

    <!-- Favorites (بعرض الصفحة) -->
    <section class="side-card fav-card mb-4">
      <div class="side-head fav-head">
        <div class="stat-icon bg-orange sm"><i class="bi bi-star-fill"></i></div>
        <div><strong>Favorites</strong><br /><small class="text-muted">Quick access</small></div>
      </div>
      <div id="favList" class="p-3 row g-3"></div>
    </section>

    <!-- Emergency (بعرض الصفحة) -->
    <section class="side-card emg-card mb-4">
      <div class="side-head emg-head">
        <div class="stat-icon bg-red sm"><i class="bi bi-heart-pulse-fill"></i></div>
        <div><strong>Emergency</strong><br /><small class="text-muted">Urgent contacts</small></div>
      </div>
      <div id="emgList" class="p-3 row g-3"></div>
    </section>
  <!-- Modal -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold" id="modalTitle">Add New Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="contactForm" novalidate>
            <div class="text-center mb-3">
              <div class="photo-circle" id="photoPreview"><i class="bi bi-person-fill"></i></div>
              <label class="btn btn-sm btn-light mt-2" for="photoInput"><i class="bi bi-camera-fill"></i> Change Photo</label>
              <input type="file" id="photoInput" accept="image/*" hidden />
            </div>

            <div class="mb-3">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" id="name" class="form-control" placeholder="Enter full name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone Number <span class="text-danger">*</span></label>
              <input type="tel" id="phone" class="form-control" placeholder="e.g., 01012345678" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" id="email" class="form-control" placeholder="name@example.com" />
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" id="address" class="form-control" placeholder="Enter address" />
            </div>
            <div class="mb-3">
              <label class="form-label">Group</label>
              <select id="group" class="form-select">
                <option value="">Select a group</option>
                <option>Family</option>
                <option>Friends</option>
                <option>Work</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea id="notes" class="form-control" rows="2" placeholder="Add notes about this contact"></textarea>
            </div>

            <div class="d-flex gap-4 mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isFav" />
                <label class="form-check-label" for="isFav"><i class="bi bi-star-fill text-warning"></i> Favorite</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isEmg" />
                <label class="form-check-label" for="isEmg"><i class="bi bi-heart-pulse-fill text-danger"></i> Emergency</label>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="button" class="btn btn-light flex-fill" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-check-lg"></i> Save Contact</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./main.js"></script>
</body>
</html>
